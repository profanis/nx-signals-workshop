<mat-card [routerLink]="['/catalogue', product().id]">
  <mat-card-header>
    <mat-card-title>{{ product().name }}</mat-card-title>
  </mat-card-header>

  <div class="image-container">
    <img
      mat-card-image
      [ngSrc]="product().imageUrl"
      [alt]="product().name"
      width="400"
      height="300"
      priority
    />

    @if (isOnSale()) {
    <span class="sale-badge">Sale</span>
    }
  </div>

  <mat-card-content>
    @if (isOnSale()) {
    <p class="price price--sale">
      <span class="sale-price">{{ salePrice() | currency }}</span>
      <span class="original-price">
        <span class="visually-hidden">Was </span>{{ price() | currency }}
      </span>
    </p>
    } @else {
    <p class="price">{{ price() | currency }}</p>
    }
  </mat-card-content>

  <mat-card-actions>
    <button
      mat-icon-button
      (click)="onToggleFavorite($event)"
      [attr.aria-label]="
        product().isFavorite ? 'Remove from favorites' : 'Add to favorites'
      "
    >
      <mat-icon>{{
        product().isFavorite ? 'favorite' : 'favorite_border'
      }}</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
