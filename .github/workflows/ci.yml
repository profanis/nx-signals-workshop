name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # ------------------------------------------------------------------
  # 1. The ordinary build. Nothing to do with Claude.
  #    This is the part that reads the COMMIT, not your working tree.
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Nx affected needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, test, build
        run: npx nx run-many -t lint,test,build

  # ------------------------------------------------------------------
  # 2. The review gate. Runs your own .claude/agents/code-reviewer.md
  #    against the pull request diff.
  # ------------------------------------------------------------------
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the review comment
      issues: read
      id-token: write # required by the action's GitHub App auth
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needs the base commit to diff against

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            1. Delegate the review to the `code-reviewer` subagent defined in
               .claude/agents/ using the Agent tool. Tell it to diff the branch
               against origin/${{ github.base_ref }} and report Critical,
               Important and Suggestion findings with file:line.
            2. Post the subagent's findings as a single PR comment with
               `gh pr comment`.
            3. Write the file review-verdict.txt in the repository root. Its
               first line must be exactly BLOCKER if there is any Critical
               finding, otherwise exactly PASS.
          claude_args: |
            --max-turns 25
            --allowedTools "Agent,Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*)"

      # The action exits 0 whatever the review says, and also when it skips
      # itself (e.g. a PR that edits this workflow). Fail closed: no verdict
      # file means the review did not run.
      - name: Enforce review verdict
        run: |
          if [ ! -f review-verdict.txt ]; then
            echo "::error::Claude review produced no verdict (skipped or failed)"
            exit 1
          fi
          cat review-verdict.txt
          if [ "$(head -n1 review-verdict.txt)" = "BLOCKER" ]; then
            echo "::error::Code review found a blocker"
            exit 1
          fi
